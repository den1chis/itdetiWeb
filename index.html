<!doctype html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#111827">
    <title>ITdeti — Вход</title>
    <link rel="stylesheet" href="mobile.css">

    <style>
        * {
            box-sizing: border-box;
        }

        :root {
            --bg: #f3f5f9;
            --card: #ffffff;
            --border: #e5e7eb;
            --text: #172033;
            --muted: #667085;
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --danger: #b42318;
            --danger-bg: #fff1f0;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background:
                radial-gradient(
                    circle at top left,
                    #e9edff,
                    transparent 42%
                ),
                var(--bg);
            font-family:
                Inter,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;
            color: var(--text);
        }

        .login {
            width: min(420px, 100%);
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 20px;
            padding: 32px;
            box-shadow: 0 24px 70px rgba(20, 30, 60, .1);
        }

        .logo {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 6px;
        }

        .subtitle {
            color: var(--muted);
            font-size: 14px;
            margin-bottom: 28px;
        }

        .field {
            margin-bottom: 18px;
        }

        label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            margin-bottom: 7px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid var(--border);
            border-radius: 11px;
            outline: none;
            font: inherit;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow:
                0 0 0 3px rgba(79, 70, 229, .1);
        }

        button {
            font: inherit;
        }

        .login-button {
            width: 100%;
            padding: 13px;
            border: 0;
            border-radius: 11px;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            cursor: pointer;
        }

        .login-button:hover {
            background: var(--primary-hover);
        }

        .login-button:disabled {
            opacity: .6;
            cursor: wait;
        }

        .error {
            display: none;
            margin-top: 14px;
            padding: 11px 12px;
            background: var(--danger-bg);
            color: var(--danger);
            border-radius: 10px;
            font-size: 13px;
        }

        .api {
            margin-top: 20px;
            text-align: center;
            color: var(--muted);
            font-size: 11px;
        }
    </style>
</head>

<body>

<div class="login">

    <div class="logo">
        ITdeti
    </div>

    <div class="subtitle">
        Панель управления школой программирования
    </div>

    <form id="loginForm">

        <div class="field">

            <label>
                Email
            </label>

            <input
                id="email"
                type="email"
                autocomplete="username"
                required
            >

        </div>

        <div class="field">

            <label>
                Пароль
            </label>

            <input
                id="password"
                type="password"
                autocomplete="current-password"
                required
            >

        </div>

        <button
            id="loginButton"
            class="login-button"
            type="submit"
        >
            Войти
        </button>

        <div
            id="error"
            class="error"
        ></div>

    </form>

    <div class="api">
        API: https://itdeti.onrender.com
    </div>

</div>

<script>

const API =
    "https://itdeti.onrender.com";

const ACCESS =
    "itdeti_access_token";

const REFRESH =
    "itdeti_refresh_token";


if (
    localStorage.getItem(ACCESS)
) {
    location.href = "app.html";
}


document
    .getElementById("loginForm")
    .addEventListener(
        "submit",
        async event => {

            event.preventDefault();

            const button =
                document.getElementById(
                    "loginButton"
                );

            const error =
                document.getElementById(
                    "error"
                );

            button.disabled = true;
            button.textContent =
                "Входим...";

            error.style.display =
                "none";

            try {

                const response =
                    await fetch(
                        `${API}/auth/login`,
                        {
                            method: "POST",
                            headers: {
                                "Content-Type":
                                    "application/json"
                            },
                            body:
                                JSON.stringify({
                                    email:
                                        document
                                            .getElementById("email")
                                            .value
                                            .trim(),
                                    password:
                                        document
                                            .getElementById("password")
                                            .value
                                })
                        }
                    );


                const data =
                    await response
                        .json()
                        .catch(() => ({}));


                if (!response.ok) {
                    throw new Error(
                        data.detail ||
                        "Ошибка авторизации"
                    );
                }


                localStorage.setItem(
                    ACCESS,
                    data.access_token
                );


                if (data.refresh_token) {
                    localStorage.setItem(
                        REFRESH,
                        data.refresh_token
                    );
                }


                location.href =
                    "app.html";

            } catch (e) {

                error.textContent =
                    e.message;

                error.style.display =
                    "block";

            } finally {

                button.disabled = false;
                button.textContent =
                    "Войти";

            }
        }
    );

</script>

</body>
</html>
