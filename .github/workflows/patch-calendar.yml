name: Finalize frontend once

on:
  push:
    branches: [main]
    paths:
      - 'tools/finalize_frontend.py'
      - 'tools/patch_standalone_masterclass.py'
      - '.github/workflows/patch-calendar.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Finalize frontend
        run: python3 tools/finalize_frontend.py

      - name: Add standalone masterclass
        run: python3 tools/patch_standalone_masterclass.py

      - name: Commit finalized app
        run: |
          if git diff --quiet -- app.html; then
            echo "No frontend changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          git commit -m "refactor: finalize frontend calendar forms"
          git push
