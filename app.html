<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<link rel="stylesheet" href="mobile.css">
<link rel="stylesheet" href="calendar.css">

<title>
    ITdeti
</title>


<style>

* {
    box-sizing: border-box;
}

:root {

    --bg: #f5f6f9;
    --surface: #ffffff;
    --surface-soft: #f8f9fc;

    --border: #e6e8ee;

    --text: #172033;
    --muted: #697386;

    --primary: #4f46e5;
    --primary-hover: #4338ca;

    --success: #14803a;
    --success-bg: #eaf8ef;

    --danger: #b42318;
    --danger-bg: #fff0ef;

    --warning: #a15c00;
    --warning-bg: #fff7e5;

    --shadow:
        0 10px 35px
        rgba(20, 30, 60, .07);
}


body {

    margin: 0;

    background:
        var(--bg);

    color:
        var(--text);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

}


button,
input,
select,
textarea {

    font: inherit;

}


button {

    cursor: pointer;

}


button:disabled {

    opacity: .55;

    cursor: wait;

}


/* =========================================================
   LAYOUT
========================================================= */

.app {

    min-height: 100vh;

    display:
        grid;

    grid-template-columns:
        230px 1fr;

}


.sidebar {

    height: 100vh;

    position: sticky;

    top: 0;

    background:
        #111827;

    color: white;

    padding:
        18px 14px;

}


.logo {

    font-size:
        21px;

    font-weight:
        800;

    padding:
        8px 12px 26px;

}


.nav {

    display:
        grid;

    gap:
        5px;

}


.nav button {

    border:
        none;

    background:
        transparent;

    color:
        #c7ced9;

    text-align:
        left;

    padding:
        11px 12px;

    border-radius:
        9px;

}


.nav button:hover,
.nav button.active {

    background:
        #1f2937;

    color:
        white;

}


.sidebar-footer {

    position:
        absolute;

    left:
        14px;

    right:
        14px;

    bottom:
        18px;

}


.logout {

    width:
        100%;

    border:
        1px solid
        #374151;

    background:
        transparent;

    color:
        #c7ced9;

    padding:
        10px;

    border-radius:
        9px;

}


.main {

    min-width:
        0;

    padding:
        24px;

}


/* =========================================================
   HEADER
========================================================= */

.page-header {

    display:
        flex;

    justify-content:
        space-between;

    align-items:
        center;

    gap:
        15px;

    margin-bottom:
        22px;

}


.page-header h1 {

    margin:
        0;

    font-size:
        27px;

}


.page-header p {

    margin:
        4px 0 0;

    color:
        var(--muted);

    font-size:
        13px;

}


/* =========================================================
   VIEW
========================================================= */

.view {

    display:
        none;

}


.view.active {

    display:
        block;

}


/* =========================================================
   CARD
========================================================= */

.card {

    background:
        var(--surface);

    border:
        1px solid
        var(--border);

    border-radius:
        16px;

    box-shadow:
        var(--shadow);

}


.card-padding {

    padding:
        16px;

}


/* =========================================================
   BUTTONS
========================================================= */

.btn {

    border:
        1px solid
        var(--border);

    background:
        var(--surface);

    padding:
        9px 12px;

    border-radius:
        9px;

    transition:
        .15s;

}


.btn:hover {

    background:
        var(--surface-soft);

}


.btn.primary {

    background:
        var(--primary);

    color:
        white;

    border-color:
        var(--primary);

}


.btn.primary:hover {

    background:
        var(--primary-hover);

}


.icon-btn {

    width:
        34px;

    height:
        34px;

    display:
        grid;

    place-items:
        center;

    border:
        0;

    border-radius:
        9px;

    background:
        transparent;

    color:
        var(--muted);

    font-size:
        20px;

}


.icon-btn:hover {

    background:
        #f0f1f5;

    color:
        var(--text);

}


/* =========================================================
   DASHBOARD
========================================================= */

.stats {

    display:
        grid;

    grid-template-columns:
        repeat(4, 1fr);

    gap:
        14px;

}


.stat {

    padding:
        17px;

}


.stat-label {

    color:
        var(--muted);

    font-size:
        13px;

}


.stat-value {

    font-size:
        25px;

    font-weight:
        800;

    margin-top:
        7px;

}


.dashboard-grid {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        14px;

    margin-top:
        14px;

}


/* =========================================================
   TABLE
========================================================= */

.table-wrap {

    overflow-x:
        auto;

}


table {

    width:
        100%;

    border-collapse:
        collapse;

}


th,
td {

    text-align:
        left;

    padding:
        11px 10px;

    border-bottom:
        1px solid
        #eef0f4;

    font-size:
        13px;

}


th {

    color:
        var(--muted);

    font-weight:
        700;

}


tbody tr.clickable {

    cursor:
        pointer;

}


tbody tr.clickable:hover {

    background:
        #fafbfe;

}


/* =========================================================
   PILLS
========================================================= */

.pill {

    display:
        inline-flex;

    padding:
        4px 8px;

    border-radius:
        999px;

    background:
        #eef0f4;

    font-size:
        11px;

    font-weight:
        700;

}


.pill.success {

    background:
        var(--success-bg);

    color:
        var(--success);

}


.pill.danger {

    background:
        var(--danger-bg);

    color:
        var(--danger);

}


.pill.warning {

    background:
        var(--warning-bg);

    color:
        var(--warning);

}


/* =========================================================
   TOOLBAR
========================================================= */

.toolbar {

    display:
        flex;

    flex-wrap:
        wrap;

    align-items:
        center;

    gap:
        8px;

    margin-bottom:
        14px;

}


.toolbar input,
.toolbar select {

    padding:
        9px 11px;

    background:
        white;

    border:
        1px solid
        var(--border);

    border-radius:
        9px;

    outline:
        none;

}


/* =========================================================
   STUDENT
========================================================= */

.student-layout {

    display:
        grid;

    grid-template-columns:
        1fr 350px;

    gap:
        14px;

}


.student-summary {

    display:
        grid;

    grid-template-columns:
        repeat(3, 1fr);

    gap:
        10px;

    margin-bottom:
        18px;

}


.summary-box {

    background:
        var(--surface-soft);

    border:
        1px solid
        var(--border);

    border-radius:
        11px;

    padding:
        12px;

}


.summary-box small {

    color:
        var(--muted);

}


.summary-box strong {

    display:
        block;

    font-size:
        19px;

    margin-top:
        4px;

}


.section-title {

    font-size:
        14px;

    font-weight:
        800;

    margin:
        22px 0 10px;

}


.parent-box,
.schedule-box {

    border:
        1px solid
        var(--border);

    background:
        var(--surface-soft);

    border-radius:
        11px;

    padding:
        12px;

    margin-bottom:
        9px;

}


/* =========================================================
   FORMS
========================================================= */

.form {

    display:
        grid;

    gap:
        12px;

}


.form-row {

    display:
        grid;

    grid-template-columns:
        1fr 1fr;

    gap:
        10px;

}


.form-group {

    display:
        grid;

    gap:
        6px;

}


.form-group label {

    font-size:
        12px;

    font-weight:
        700;

}


.form-group input,
.form-group select,
.form-group textarea {

    width:
        100%;

    padding:
        10px 11px;

    border:
        1px solid
        var(--border);

    border-radius:
        9px;

    outline:
        none;

    background:
        white;

}


.form-group input:focus,
.form-group select:focus,
.form-group textarea:focus {

    border-color:
        var(--primary);

}


.form-actions {

    display:
        flex;

    justify-content:
        flex-end;

    gap:
        8px;

    margin-top:
        6px;

}


/* =========================================================
   CALENDAR
========================================================= */

.calendar-toolbar {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    gap:
        10px;

    margin-bottom:
        14px;

}


.calendar-left {

    display:
        flex;

    align-items:
        center;

    gap:
        6px;

}


.calendar-title {

    font-size:
        17px;

    font-weight:
        800;

    margin:
        0 12px;

}


.view-switcher {

    display:
        flex;

    border:
        1px solid
        var(--border);

    border-radius:
        9px;

    overflow:
        hidden;

}


.view-switcher button {

    border:
        0;

    background:
        white;

    padding:
        8px 10px;

    font-size:
        12px;

}


.view-switcher button.active {

    background:
        #eef0ff;

    color:
        var(--primary);

    font-weight:
        700;

}







.time-column {

    border-right:
        1px solid
        var(--border);

}





.day-header {

    height:
        58px;

    padding:
        9px;

    text-align:
        center;

    background:
        #fafbfe;

    border-bottom:
        1px solid
        var(--border);

    cursor:
        pointer;

}


.day-header:hover {

    background:
        #f1f3f9;

}


.day-number {

    display:
        block;

    font-size:
        18px;

    font-weight:
        800;

}


.day-name {

    font-size:
        11px;

    color:
        var(--muted);

}








.calendar-scroll {
    width: 100%;
    overflow-x: hidden;
    overflow-y: hidden;
}


.week-calendar {
    display: grid;
    grid-template-columns: 38px repeat(7, minmax(0, 1fr));
    width: 100%;
    min-width: 0;
}


.time-column {
    border-right: 1px solid var(--border);
}


.day-column {
    position: relative;
    min-height: 0;
    border-right: 1px solid var(--border);
    overflow: hidden;
}


.day-header {
    height: 42px;

    padding: 5px;

    text-align: center;

    background: #fafbfe;

    border-bottom: 1px solid var(--border);

    cursor: pointer;
}


.day-header:hover {
    background: #f1f3f9;
}


.day-number {
    display: block;
    font-size: 15px;
    font-weight: 800;
    line-height: 17px;
}


.day-name {
    display: block;
    font-size: 10px;
    color: var(--muted);
    line-height: 12px;
}


.hour-line {
    height: 30px;
    border-bottom: 1px solid #eef0f4;
}


.time-label {
    height: 30px;

    border-bottom: 1px solid #eef0f4;

    text-align: right;

    padding:
        2px 5px;

    color: #8a93a3;

    font-size: 9px;

    line-height: 26px;
}


.calendar-event {
    position: absolute;

    left: 3px;
    right: 3px;

    padding: 4px 5px;

    border-radius: 6px;

    color: white;

    background: var(--primary);

    overflow: hidden;

    cursor: pointer;

    font-size: 10px;

    line-height: 12px;

    z-index: 2;

    box-shadow:
        0 1px 3px rgba(0,0,0,.08);
}


.calendar-event.masterclass {
    background: #b45309;
}


.calendar-event.personal {
    background: #475569;
}


.calendar-event:hover {
    filter: brightness(.96);
}


.calendar-event-title {
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


.calendar-event-meta {
    opacity: .92;
    font-size: 9px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}


.calendar-icon {
    display: inline-flex;

    width: 15px;
    height: 15px;

    align-items: center;
    justify-content: center;

    margin-right: 4px;

    font-size: 10px;
    font-weight: 800;

    vertical-align: -1px;
}


.status-icon {
    display: inline-flex;

    width: 16px;
    height: 16px;

    align-items: center;
    justify-content: center;

    border-radius: 5px;

    font-size: 10px;
    font-weight: 800;

    flex-shrink: 0;
}


.status-icon.planned {
    background: #eef0ff;
    color: var(--primary);
}


.status-icon.completed {
    background: var(--success-bg);
    color: var(--success);
}


.status-icon.alert {
    background: var(--warning-bg);
    color: var(--warning);
}


.calendar-event.masterclass {

    background:
        #b45309;

}


.calendar-event.personal {

    background:
        #475569;

}


.calendar-event.cancelled {

    opacity:
        .5;

    text-decoration:
        line-through;

}


.list-calendar {

    display:
        grid;

    gap:
        10px;

}


.list-day {

    padding:
        13px;

    background:
        var(--surface-soft);

    border:
        1px solid
        var(--border);

    border-radius:
        11px;

}


.list-date {

    font-weight:
        800;

    margin-bottom:
        8px;

}


.calendar-item {

    display:
        flex;

    justify-content:
        space-between;

    gap:
        10px;

    padding:
        10px;

    background:
        white;

    border:
        1px solid
        var(--border);

    border-radius:
        9px;

    margin-bottom:
        6px;

    cursor:
        pointer;

}


.calendar-item:hover {

    background:
        #fbfcff;

}


.day-calendar {

    max-width:
        100%;

}


.day-title {

    font-size:
        18px;

    font-weight:
        800;

    margin-bottom:
        12px;

}


/* =========================================================
   FINANCE
========================================================= */

.finance-grid {

    display:
        grid;

    grid-template-columns:
        repeat(5, 1fr);

    gap:
        12px;

}


.money-large {

    font-size:
        24px;

    font-weight:
        800;

    margin-top:
        5px;

}


/* =========================================================
   MODAL
========================================================= */

.modal {

    position:
        fixed;

    inset:
        0;

    display:
        none;

    justify-content:
        center;

    align-items:
        center;

    background:
        rgba(
            15,
            23,
            42,
            .45
        );

    z-index:
        500;

    padding:
        18px;

}


.modal.open {

    display:
        flex;

}


.modal-box {

    width:
        min(
            720px,
            100%
        );

    max-height:
        calc(
            100vh - 36px
        );

    overflow-y:
        auto;

    background:
        white;

    border-radius:
        18px;

    box-shadow:
        0 25px 80px
        rgba(
            10,
            20,
            40,
            .2
        );

}


.modal-header {

    display:
        flex;

    align-items:
        center;

    justify-content:
        space-between;

    padding:
        16px 18px;

    border-bottom:
        1px solid
        var(--border);

}


.modal-header h2 {

    margin:
        0;

    font-size:
        18px;

}


.modal-body {

    padding:
        18px;

}


.close {

    width:
        34px;

    height:
        34px;

    display:
        grid;

    place-items:
        center;

    border:
        0;

    border-radius:
        9px;

    background:
        transparent;

    color:
        #7a8497;

    font-size:
        25px;

}


.close:hover {

    background:
        #f0f1f5;

    color:
        #111827;

}


/* =========================================================
   EMPTY
========================================================= */

.empty {

    color:
        var(--muted);

    text-align:
        center;

    padding:
        28px;

}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:1100px) {

    .stats,
    .finance-grid {

        grid-template-columns:
            repeat(
                2,
                1fr
            );

    }

    .student-layout {

        grid-template-columns:
            1fr;

    }

}


@media(max-width:760px) {

    .app {

        display:
            block;

    }

    .sidebar {

        height:
            auto;

        position:
            sticky;

        top:
            0;

        z-index:
            100;

    }

    .nav {

        grid-template-columns:
            repeat(
                5,
                1fr
            );

    }

    .nav button {

        text-align:
            center;

        font-size:
            11px;

    }

    .sidebar-footer {

        position:
            static;

        margin-top:
            10px;

    }

    .main {

        padding:
            14px;

    }

    .page-header {

        align-items:
            flex-start;

        flex-direction:
            column;

    }

    .stats,
    .finance-grid,
    .dashboard-grid,
    .form-row,
    .student-summary {

        grid-template-columns:
            1fr;

    }

}

</style>

</head>

<body>


<div class="app">


<!-- ========================================================
     SIDEBAR
========================================================= -->

<aside class="sidebar">

    <div class="logo">
        ITdeti
    </div>

    <nav class="nav">

        <button
            class="active"
            data-page="dashboard"
        >
            Главная
        </button>

        <button
            data-page="students"
        >
            Ученики
        </button>

        <button
            data-page="schedule"
        >
            Расписание
        </button>

        <button
            data-page="finance"
        >
            Финансы
        </button>

        <button
            data-page="notifications"
        >
            Уведомления
        </button>

    </nav>


    <div class="sidebar-footer">

        <button
            class="logout"
            id="logout"
        >
            Выйти
        </button>

    </div>

</aside>


<!-- ========================================================
     MAIN
========================================================= -->

<main class="main">


<header class="page-header">

    <div>

        <h1 id="pageTitle">
            Главная
        </h1>

        <p id="pageSubtitle">
            Управление школой
        </p>

    </div>

</header>


<!-- ========================================================
     DASHBOARD
========================================================= -->

<section
    id="dashboard"
    class="view active"
>

<div
    id="dashboardStats"
    class="stats"
></div>


<div class="dashboard-grid">


<div class="card card-padding">

    <div class="section-title">
        Сегодня
    </div>

    <div
        id="dashboardSchedule"
    ></div>

</div>


<div class="card card-padding">

    <div class="section-title">
        На контроле
    </div>

    <div
        id="dashboardAlerts"
    ></div>

</div>


</div>

</section>


<!-- ========================================================
     STUDENTS
========================================================= -->

<section
    id="students"
    class="view"
>


<div class="toolbar">

    <input
        id="studentSearch"
        placeholder="Поиск ученика..."
    >

    <button
        class="btn primary"
        id="newStudent"
    >
        + Ученик
    </button>

</div>


<div class="card card-padding">

<div class="table-wrap">

<table>

<thead>

<tr>

<th>
    Ученик
</th>

<th>
    Курс
</th>

<th>
    Цена
</th>

<th>
    Баланс
</th>

<th>
    Занятий
</th>

</tr>

</thead>


<tbody
    id="studentsTable"
></tbody>


</table>

</div>

</div>

</section>


<!-- ========================================================
     SCHEDULE
========================================================= -->

<section
    id="schedule"
    class="view"
>


<div class="toolbar">

    <button
        class="btn primary"
        id="addLesson"
    >
        + Добавить урок
    </button>

    <button
        class="btn"
        id="addEvent"
    >
        + Событие
    </button>

</div>


<div class="card card-padding">


<div class="calendar-toolbar">

<div class="calendar-left">

    <button
        class="icon-btn"
        id="prevPeriod"
        title="Назад"
    >
        ‹
    </button>

    <button
        class="btn"
        id="todayPeriod"
    >
        Сегодня
    </button>

    <button
        class="icon-btn"
        id="nextPeriod"
        title="Вперёд"
    >
        ›
    </button>

    <div
        class="calendar-title"
        id="calendarTitle"
    ></div>

</div>


<div class="view-switcher">

    <button
        data-calendar-view="month"
        class="active"
    >
        Месяц
    </button>

    <button
        data-calendar-view="week"
    >
        Неделя
    </button>

    <button
        data-calendar-view="list"
    >
        Список
    </button>

    <button
        data-calendar-view="day"
    >
        День
    </button>

</div>


</div>


<div
    id="calendar"
></div>


</div>

</section>


<!-- ========================================================
     FINANCE
========================================================= -->

<section
    id="finance"
    class="view"
>


<div
    id="financeStats"
    class="finance-grid"
></div>


<div
    class="toolbar"
    style="margin-top:14px"
>

    <button
        class="btn primary"
        id="addPayment"
    >
        + Оплата
    </button>

    <button
        class="btn"
        id="addExpense"
    >
        + Расход

async function cleanupStudentBeforeDelete(studentId){

    for(const lesson of lessons||[]){
        try{await api(`/lessons/${lesson.id}`,{method:'DELETE'});}catch(e){if(!/not found/i.test(String(e.message||'')))throw e;}
    }
    const slots=await api(`/students/${studentId}/schedule?include_inactive=true`);
    for(const slot of slots||[]){
        try{await api(`/students/${studentId}/schedule/${slot.id}`,{method:'DELETE'});}catch(e){if(!/not found/i.test(String(e.message||'')))throw e;}
    }
}

async function createOrReactivateStudentSchedule(path, options){
    try{return await api(path,options)}catch(e){
        if(!/already exists|уже существует/i.test(String(e.message||''))) throw e;
        const m=path.match(/\/students\/([^/]+)\/schedule$/); if(!m) throw e;
        const studentId=m[1]; const p=JSON.parse(options.body||'{}');
        const slots=await api(`/students/${studentId}/schedule?include_inactive=true`);
        const existing=(slots||[]).find(s=>Number(s.day_of_week)===Number(p.day_of_week) && String(s.start_time).slice(0,5)===String(p.start_time).slice(0,5) && String(s.valid_from)===String(p.valid_from));
        if(!existing) throw e;
        return await api(`/students/${studentId}/schedule/${existing.id}`,{method:'PATCH',body:JSON.stringify({...p,is_active:true,valid_until:null})});
    }
}

/* =========================================================
   AUTH / API
========================================================= */

async function refreshAccess() {

    const token =
        localStorage.getItem(
            REFRESH
        );

    if (!token)
        return false;


    const response =
        await fetch(
            `${API}/auth/refresh`,
            {
                method:
                    "POST",
                headers: {
                    "Content-Type":
                        "application/json"
                },
                body:
                    JSON.stringify({
                        refresh_token:
                            token
                    })
            }
        );


    if (!response.ok)
        return false;


    const data =
        await response.json();


    localStorage.setItem(
        ACCESS,
        data.access_token
    );


    if (data.refresh_token) {

        localStorage.setItem(
            REFRESH,
            data.refresh_token
        );

    }


    return true;

}


async function api(
    path,
    options = {},
    retry = true
) {

    const token =
        localStorage.getItem(
            ACCESS
        );


    if (!token) {

        location.href =
            "index.html";

        throw new Error(
            "Не авторизован"
        );

    }


    const headers =
        new Headers(
            options.headers || {}
        );


    headers.set(
        "Authorization",
        `Bearer ${token}`
    );


    if (
        options.body &&
        !headers.has(
            "Content-Type"
        )
    ) {

        headers.set(
            "Content-Type",
            "application/json"
        );

    }


    let response;

    try {
        response = await fetch(API + path, { ...options, headers });
    } catch (error) {
        throw new Error("Не удалось связаться с сервером. Проверьте интернет-соединение и доступность сервера.");
    }


    if (
        response.status === 401 &&
        retry
    ) {

        if (
            await refreshAccess()
        ) {

            return api(
                path,
                options,
                false
            );

        }

    }


    if (
        response.status === 401
    ) {

        localStorage.removeItem(
            ACCESS
        );

        localStorage.removeItem(
            REFRESH
        );

        location.href =
            "index.html";

        throw new Error(
            "Сессия истекла"
        );

    }


    const data =
        await response
            .json()
            .catch(
                () => ({})
            );


            if (!response.ok) {

                let message;

                if (typeof data.detail === "string") {

                    message = data.detail;

                } else if (Array.isArray(data.detail)) {

                    message = data.detail
                        .map(error => {
                            const location =
                                Array.isArray(error.loc)
                                    ? error.loc.join(".")
                                    : "";

                            return `${location}: ${error.msg || "Ошибка"}`;
                        })
                        .join("\n");

                } else if (data.detail) {

                    message =
                        JSON.stringify(
                            data.detail,
                            null,
                            2
                        );

                } else {

                    message =
                        `Ошибка HTTP ${response.status}`;

                }

                throw new Error(message);
                }


    return data;

}

function startOfWeek(
    date
) {

    const d =
        new Date(date);

    d.setHours(
        0,
        0,
        0,
        0
    );

    const day =
        d.getDay();

    const diff =
        day === 0
        ? -6
        : 1 - day;

    d.setDate(
        d.getDate() + diff
    );

    return d;

}


function endOfWeek(
    date
) {

    const start =
        startOfWeek(
            date
        );

    const end =
        new Date(start);

    end.setDate(
        start.getDate() + 6
    );

    return end;

}


async function loadCalendar() {

    try {

        let endpoint;


        if (
            state.calendar.view ===
            "month"
        ) {

            const month =
                new Date(
                    state.calendar.date
                );

            month.setDate(1);

            endpoint =
                `/schedule/month?month_start=${dateKey(month)}`;

        } else {

            const start =
                startOfWeek(
                    state.calendar.date
                );

            endpoint =
                `/schedule/week?week_start=${dateKey(start)}`;

        }


        state.calendar.items =
            await api(
                endpoint
            );


        renderCalendar();

    } catch (e) {

        $("#calendar")
            .innerHTML =
            `<div class="empty">
                ${esc(e.message)}
            </div>`;

    }

}




/* ITDETI_CALENDAR_CONTROLS_V2 */
function calendarMonthLabel(date) {
    return date.toLocaleDateString("ru-RU", {month:"long", year:"numeric"});
}

function calendarRangeLabel() {
    const d = new Date(state.calendar.date);
    if (state.calendar.view === "month") return calendarMonthLabel(d);
    if (state.calendar.view === "day") {
        return d.toLocaleDateString("ru-RU", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
    }
    const start = startOfWeek(d);
    const end = endOfWeek(d);
    return `${start.toLocaleDateString("ru-RU", {day:"numeric", month:"long"})} — ${end.toLocaleDateString("ru-RU", {day:"numeric", month:"long", year:"numeric"})}`;
}

function calendarMove(direction) {
    const d = new Date(state.calendar.date);
    if (state.calendar.view === "month") {
        d.setDate(1);
        d.setMonth(d.getMonth() + direction);
    } else if (state.calendar.view === "day") {
        d.setDate(d.getDate() + direction);
    } else {
        d.setDate(d.getDate() + direction * 7);
    }
    state.calendar.date = d;
    loadCalendar();
}

function updateCalendarViewButtons() {
    document.querySelectorAll("[data-calendar-view]").forEach(button => {
        button.classList.toggle("active", button.dataset.calendarView === state.calendar.view);
    });
}

function calendarPickerDays(monthDate) {
    const year = monthDate.getFullYear();
    const month = monthDate.getMonth();
    const first = new Date(year, month, 1);
    const offset = first.getDay() === 0 ? 6 : first.getDay() - 1;
    const count = new Date(year, month + 1, 0).getDate();
    const cells = [];
    for (let i = 0; i < offset; i++) cells.push(null);
    for (let day = 1; day <= count; day++) cells.push(new Date(year, month, day));
    return cells;
}

function renderCalendarHeader() {
    const title = $("#calendarTitle");
    if (!title) return;
    title.innerHTML = `
        <div class="calendar-title-wrap">
            <button type="button" class="calendar-month-title" id="calendarMonthTitle">${calendarRangeLabel()}</button>
            <div class="calendar-month-picker" id="calendarMonthPicker" hidden></div>
        </div>`;
    const button = $("#calendarMonthTitle");
    if (button) button.onclick = event => {
        event.stopPropagation();
        const picker = $("#calendarMonthPicker");
        if (!picker.hidden) {
            picker.hidden = true;
            return;
        }
        renderCalendarMonthPicker();
        picker.hidden = false;
    };
}

function renderCalendarMonthPicker() {
    const picker = $("#calendarMonthPicker");
    if (!picker) return;
    const month = new Date(state.calendar.date);
    month.setDate(1);
    const cells = calendarPickerDays(month);
    const todayKey = dateKey(new Date());
    const monthTitle = calendarMonthLabel(month);
    picker.innerHTML = `
        <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:8px">
            <button type="button" class="icon-btn" id="calendarPickerPrev">‹</button>

            <button type="button" class="icon-btn" id="calendarPickerNext">›</button>
        </div>
        <div style="display:grid;grid-template-columns:repeat(7,1fr);gap:2px;font-size:10px;color:var(--muted);text-align:center;margin-bottom:3px">
            ${DAYS_SHORT.map(day => `<div>${day}</div>`).join("")}
        </div>
        <div class="calendar-month-picker-grid">
            ${cells.map(date => date ? `<button type="button" class="${dateKey(date) === todayKey ? "today" : ""}" data-picker-date="${dateKey(date)}">${date.getDate()}</button>` : `<span></span>`).join("")}
        </div>
        <button type="button" class="btn" id="calendarPickerToday" style="width:100%;margin-top:8px">Сегодня</button>`;

    $("#calendarPickerPrev").onclick = () => {
        month.setMonth(month.getMonth() - 1);
        state.calendar.date = month;
        renderCalendarMonthPicker();
    };
    $("#calendarPickerNext").onclick = () => {
        month.setMonth(month.getMonth() + 1);
        state.calendar.date = month;
        renderCalendarMonthPicker();
    };
    $("#calendarPickerToday").onclick = () => {
        state.calendar.date = new Date();
        state.calendar.view = "day";
        updateCalendarViewButtons();
        loadCalendar();
    };
    picker.querySelectorAll("[data-picker-date]").forEach(button => {
        button.onclick = () => {
            state.calendar.date = new Date(`${button.dataset.pickerDate}T12:00:00`);
            state.calendar.view = "day";
            updateCalendarViewButtons();
            loadCalendar();
        };
    });
}

function bindCalendarControls() {
    $("#prevPeriod").onclick = () => calendarMove(-1);
    $("#nextPeriod").onclick = () => calendarMove(1);
    $("#todayPeriod").onclick = () => {
        state.calendar.date = new Date();
        loadCalendar();
    };
    document.querySelectorAll("[data-calendar-view]").forEach(button => {
        button.onclick = () => {
            state.calendar.view = button.dataset.calendarView;
            updateCalendarViewButtons();
            loadCalendar();
        };
    });
    document.addEventListener("click", event => {
        const title = $("#calendarTitle");
        if (title && !title.contains(event.target)) {
            const picker = $("#calendarMonthPicker");
            if (picker) picker.hidden = true;
        }
    });
    updateCalendarViewButtons();
}

function renderCalendar() {

    const start =
        startOfWeek(
            state.calendar.date
        );

    const end =
        endOfWeek(
            state.calendar.date
        );


    renderCalendarHeader();


    if (
        state.calendar.view ===
        "month"
    ) {

        renderMonthCalendar(
            state.calendar.date
        );

    }


    if (
        state.calendar.view ===
        "week"
    ) {

        renderWeekCalendar(
            start
        );

    }


    if (
        state.calendar.view ===
        "list"
    ) {

        renderListCalendar(
            start
        );

    }


    if (
        state.calendar.view ===
        "day"
    ) {

        renderDayCalendar(
            state.calendar.date
        );

    }

}


function itemsForDate(
    date
) {

    const key =
        dateKey(date);


    return state.calendar.items
        .filter(
            item =>
                !item.is_cancelled &&
                dateKey(
                    new Date(
                        item.start_time
                    )
                ) === key
        )
        .sort(
            (
                a,
                b
            ) =>
                new Date(a.start_time) -
                new Date(b.start_time)
        );

}

function getCalendarStatus(
    item
) {

    if (
        item.item_type !==
        "lesson"
    ) {

        return {
            icon: "",
            title: ""
        };

    }


    const end =
        new Date(
            item.end_time
        );


    if (
        Date.now() >=
        end.getTime()
    ) {

        return {
            icon: "✓",
            title: "Проведено"
        };

    }


    return {
        icon: "◷",
        title: "Запланировано"
    };

}


function getCalendarIcon(
    item
) {

    if (
        item.item_type ===
        "event"
    ) {

        return "•";

    }


    if (
        item.lesson_kind ===
        "masterclass"
    ) {

        return "◆";

    }


    return "●";

}

function renderWeekCalendar(start) {
    const HOURS = Array.from({length: 17}, (_, i) => i + 7);
    let html = `
        <div class="calendar-scroll">
            <div class="week-calendar">
                <div class="time-column">
                    <div class="day-header" style="cursor:default"></div>
                    ${HOURS.map(hour => `<div class="time-label">${pad(hour)}:00</div>`).join("")}
                </div>`;

    for (let dayIndex = 0; dayIndex < 7; dayIndex++) {
        const date = new Date(start);
        date.setDate(start.getDate() + dayIndex);
        const items = itemsForDate(date);
        const isToday = dateKey(date) === dateKey(new Date());
        html += `
            <div class="day-column">
                <div class="day-header ${isToday ? "today" : ""}"
                     onclick="state.calendar.date=new Date('${dateKey(date)}T12:00:00');state.calendar.view='day';updateCalendarViewButtons();renderCalendar();">
                    <span class="day-number">${date.getDate()}</span>
                    <span class="day-name">${DAYS_SHORT[dayIndex]}</span>
                </div>`;
        HOURS.forEach(() => { html += `<div class="hour-line"></div>`; });

        items.forEach(item => {
            const dt = new Date(item.start_time);
            const end = new Date(item.end_time);
            const minutes = dt.getHours() * 60 + dt.getMinutes() - 7 * 60;
            const duration = Math.max(30, (end - dt) / 60000);
            const top = 42 + minutes * (30 / 60);
            const height = Math.max(22, duration * (30 / 60));
            const color = calendarColor(item);
            html += `
                <div class="calendar-event"
                     style="top:${top}px;height:${height}px;--item-color:${color};"
                     onclick="event.stopPropagation();openCalendarItem('${item.item_id}','${item.item_type}');">
                    <div class="calendar-event-title">${esc(item.item_type === "event" ? item.title : (item.student_name || item.title))}</div>
                    <div class="calendar-event-meta">${dt.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"})}</div>
                </div>`;
        });
        html += `</div>`;
    }

    html += `</div></div>`;
    $("#calendar").innerHTML = html;
}

function renderMonthCalendar(monthDate) {
    const year = monthDate.getFullYear();
    const month = monthDate.getMonth();
    const first = new Date(year, month, 1);
    const firstWeekday = first.getDay() === 0 ? 6 : first.getDay() - 1;
    const daysInMonth = new Date(year, month + 1, 0).getDate();
    const cells = [];

    for (let i = 0; i < firstWeekday; i++) {
        const d = new Date(year, month, 1 - (firstWeekday - i));
        cells.push({date:d, other:true});
    }
    for (let day = 1; day <= daysInMonth; day++) cells.push({date:new Date(year, month, day), other:false});
    while (cells.length % 7) {
        const last = cells[cells.length - 1].date;
        const d = new Date(last); d.setDate(last.getDate() + 1);
        cells.push({date:d, other:true});
    }

    let html = `<div class="google-month-calendar">
        <div class="google-month-weekdays">${DAYS_SHORT.map(d => `<div>${d}</div>`).join("")}</div>
        <div class="google-month-grid">`;

    cells.forEach(cell => {
        const date = cell.date;
        const items = itemsForDate(date);
        const today = dateKey(date) === dateKey(new Date());
        const classes = `google-month-day ${cell.other ? "other-month" : ""} ${today ? "today" : ""}`;
        const dots = [...new Map(items.map(item => [calendarColor(item), item])).values()].slice(0, 5);
        const visible = items.slice(0, 3);

        html += `<div class="${classes}" onclick="state.calendar.date=new Date('${dateKey(date)}T12:00:00');state.calendar.view='day';updateCalendarViewButtons();renderCalendar();">
            <div class="google-month-number">${date.getDate()}</div>
            <div class="google-month-dots">${dots.map(item => `<span class="google-month-dot" style="background:${calendarColor(item)}"></span>`).join("")}</div>
            <div class="google-month-events">
                ${visible.map(item => {
                    const time = new Date(item.start_time).toLocaleTimeString("ru-RU", {hour:"2-digit",minute:"2-digit"});
                    const label = item.item_type === "event" ? item.title : (item.student_name || item.title);
                    return `<div class="google-month-event" style="--item-color:${calendarColor(item)}" onclick="event.stopPropagation();openCalendarItem('${item.item_id}','${item.item_type}');">${time} · ${esc(label)}</div>`;
                }).join("")}
                ${items.length > 3 ? `<div class="google-month-more">ещё ${items.length - 3}</div>` : ""}
            </div>
        </div>`;
    });

    html += `</div></div>`;
    $("#calendar").innerHTML = html;
}

function renderListCalendar(start) {
    const days = [];
    for (let i = 0; i < 7; i++) {
        const date = new Date(start);
        date.setDate(start.getDate() + i);
        days.push(date);
    }

    let html = `<div class="agenda-calendar" id="agendaCalendar">`;

    days.forEach(date => {
        const items = itemsForDate(date);
        const isToday = dateKey(date) === dateKey(new Date());
        const weekday = date.toLocaleDateString("ru-RU", { weekday: "short" }).replace('.', '');
        const dateText = date.toLocaleDateString("ru-RU", { day: "numeric", month: "short" }).replace('.', '');

        html += `
            <section class="agenda-day ${isToday ? "today" : ""}" data-agenda-date="${dateKey(date)}">
                <div class="agenda-date ${isToday ? "today" : ""}">
                    <span class="weekday">${weekday}</span>
                    <span class="date">${dateText}</span>
                    ${isToday ? `<span class="agenda-today-badge">Сегодня</span>` : ""}
                </div>
                <div class="agenda-events">
                    ${items.length ? items.map(item => {
                        const startTime = new Date(item.start_time);
                        const endTime = new Date(item.end_time);
                        const time = startTime.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
                        const end = endTime.toLocaleTimeString("ru-RU", {hour:"2-digit", minute:"2-digit"});
                        const title = item.item_type === "event" ? item.title : (item.student_name || item.title || "Занятие");
                        const meta = item.item_type === "event"
                            ? (item.location || item.event_type || "")
                            : (item.lesson_kind === "masterclass" ? "Мастер-класс" : (item.course || "Урок"));
                        const color = calendarColor(item);
                        return `
                            <div class="agenda-row" data-agenda-item="${esc(item.item_id)}">
                                <div class="agenda-time">
                                    <span>${time}</span>
                                </div>
                                <button type="button"
                                        class="agenda-card"
                                        style="--item-color:${color}"
                                        onclick="openCalendarItem('${item.item_id}','${item.item_type}')">
                                    <div class="agenda-card-title">${esc(title)}</div>
                                    <div class="agenda-card-meta">${esc(meta)}${meta ? " · " : ""}${time}–${end}</div>
                                </button>
                            </div>`;
                    }).join("") : `<div class="agenda-empty">Нет событий</div>`}
                </div>
            </section>`;
    });

    html += `</div>`;
    $("#calendar").innerHTML = html;

    // On mobile, open the agenda at today; if there is a current/future item,
    // scroll a little further so the first useful entry is immediately visible.
    const container = $("#agendaCalendar");
    const today = container?.querySelector(".agenda-day.today");
    if (today) {
        requestAnimationFrame(() => today.scrollIntoView({block: "start", behavior: "auto"}));
    }
}

function renderDayCalendar(date) {
    const items = itemsForDate(date);
    $("#calendar").innerHTML = `
        <div class="day-calendar">
            <div class="day-title">${date.toLocaleDateString("ru-RU", {weekday:"long",day:"numeric",month:"long",year:"numeric"})}</div>
            ${items.length ? items.map(item => calendarItemHtml(item)).join("") : `<div class="empty">На этот день записей нет</div>`}
        </div>`;
}

function calendarColor(item) {
    const value = String(item?.color || "").trim();
    if (/^#[0-9a-fA-F]{6}$/.test(value)) return value;
    return item?.item_type === "event" ? "#64748b" : item?.lesson_kind === "masterclass" ? "#d97706" : "#4f46e5";
}

function getVisibleLessonStatus(item) { return item.item_type === "lesson" && Date.now() >= new Date(item.end_time).getTime() ? "Проведено" : "Запланировано"; }

function calendarItemHtml(item) {
    const color = calendarColor(item);
    const title = item.item_type === "event" ? item.title : (item.student_name || item.title);
    const subtitle = item.item_type === "event" ? (item.location || "") : (item.lesson_kind === "masterclass" ? "Мастер-класс" : "Урок");
    return `
        <div class="calendar-item calendar-colored"
             style="--item-color:${color}"
             onclick="openCalendarItem('${item.item_id}','${item.item_type}')">
            <div>
                <b>${esc(title)}</b>
                <div class="small">${formatDateTime(item.start_time)}${subtitle ? ` · ${esc(subtitle)}` : ""}</div>

        </div>`;
}

function defaultEventStartValue() {
    const d = new Date();
    d.setMinutes(0, 0, 0);
    d.setHours(d.getHours() + 1);
    return toLocalInput(d.toISOString());
}

function defaultEventEndValue(item) {
    if (item?.end_time) return toLocalInput(item.end_time);
    const start = item?.start_time ? new Date(item.start_time) : new Date();
    if (!item?.start_time) {
        start.setMinutes(0, 0, 0);
        start.setHours(start.getHours() + 1);
    }
    return toLocalInput(new Date(start.getTime() + 60 * 60 * 1000).toISOString());
}

                            body:

                                )
                        }
                    );

                await loadDashboard();

            } catch (e) {

                appNotify(
                    e.message
                );

            } finally {

                button.disabled =
                    false;

                        }
                    );


                    closeModal();

                    await loadCalendar();

                    await loadDashboard();

                } catch (e) {

                    appNotify(

                    );

                }

            };

}

async function saveWeeklySchedule() {

    const button =
        $("#saveWeeklySchedule");


    const studentId =
        $("#newLessonStudent")
            .value;


    const kind =
        $("#newLessonKind")
            .value;


    const duration =
        Number(
            $("#newDuration")
                .value
        );


    const days =
        [
            ...document
                .querySelectorAll(
                    ".weekly-day"
                )
        ];


    const times =
        [
            ...document
                .querySelectorAll(
                    ".weekly-time"
                )
        ];


    button.disabled =
        true;

    button.textContent =
        "Сохраняем...";


    const created = [];


    try {

        for (
            let i = 0;
            i < days.length;
            i++
        ) {

            try {

                const result =
                    await api(
                        `/students/${studentId}/schedule`,
                        {
                            method:
                                "POST",
                            body:
                                JSON.stringify({

                                    lesson_kind:
                                        kind,

                                    color:
                                        $("#newLessonColor").value,

                                    day_of_week:
                                        Number(
                                            days[i]
                                                .value
                                        ),

                                    start_time:
                                        times[i]
                                            .value,

                                    duration_minutes:
                                        duration,

                                    valid_from:
                                        dateKey(
                                            new Date()
                                        ),

                                    valid_until:
                                        null

                                })
                        }
                    );


                created.push(
                    result.id
                );

            } catch (e) {

                // Compensating rollback.
                for (
                    const id of created
                ) {

                    try {

                        await api(
                            `/students/${studentId}/schedule/${id}`,
                            {
                                method:
                                    "DELETE"
                            }
                        );

                    } catch (_) {}

                }

                throw e;

            }

        }


        closeModal();

        await loadStudents();

        await loadCalendar();

        await loadDashboard();

    } catch (e) {

        appNotify(
            e.message
        );

    } finally {

        button.disabled =
            false;

        button.textContent =
            "Сохранить";

    }

}

function toLocalInput(
    value
) {

    if (!value)
        return "";

    const d =
        new Date(value);

    return [
        d.getFullYear(),
        "-",
        pad(
            d.getMonth() + 1
        ),
        "-",
        pad(
            d.getDate()
        ),
        "T",
        pad(
            d.getHours()
        ),
        ":",
        pad(
            d.getMinutes()
        )
    ].join("");

}
