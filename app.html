<!doctype html>
<html lang="ru">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<!-- ВАЖНО: после правки любого .css/.js поменяйте ?v=… у ВСЕХ подключений
     (в app.html и index.html), иначе телефон может взять старый файл из кэша. -->
<link rel="stylesheet" href="mobile.css?v=2026110702">
<link rel="stylesheet" href="calendar.css?v=2026110702">

<title>
    ITdeti
</title>


<link rel="stylesheet" href="app.css?v=2026110702">
<link rel="stylesheet" href="tasks.css?v=2026110702">

</head>

<body>


<div class="app">


<!-- ========================================================
     SIDEBAR
========================================================= -->

<aside class="sidebar">

    <div class="logo">
        ITdeti
    </div>

    <nav class="nav">

        <button
            class="active"
            data-page="dashboard"
        >
            Главная
        </button>

        <button
            data-page="students"
        >
            Ученики
        </button>

        <button
            data-page="schedule"
        >
            Расписание
        </button>

        <button
            data-page="finance"
        >
            Финансы
        </button>

        <button
            data-page="notifications"
        >
            Уведомления
        </button>

    </nav>


    <div class="sidebar-footer">

        <button
            class="logout"
            id="logout"
        >
            Выйти
        </button>

    </div>

</aside>


<!-- ========================================================
     MAIN
========================================================= -->

<main class="main">


<header class="page-header">

    <div>

        <h1 id="pageTitle">
            Главная
        </h1>

        <p id="pageSubtitle">
            Управление школой
        </p>

    </div>

</header>


<!-- ========================================================
     DASHBOARD
========================================================= -->

<section
    id="dashboard"
    class="view active"
>

<div
    id="dashboardStats"
    class="stats"
></div>


<div class="dashboard-grid">


<div class="card card-padding">

    <div class="section-title">
        Сегодня
    </div>

    <div
        id="dashboardSchedule"
    ></div>

</div>


<div class="card card-padding">

    <div class="itdt-dash-head">
        <div class="section-title">
            Задачи на сегодня
        </div>
        <button type="button" class="itdt-link" id="dashboardTasksOpen">Все задачи →</button>
    </div>

    <div
        id="dashboardTasks"
    ><div class="empty">Загрузка…</div></div>

</div>


</div>

</section>


<!-- ========================================================
     STUDENTS
========================================================= -->

<section
    id="students"
    class="view"
>


<div class="toolbar">

    <input
        id="studentSearch"
        placeholder="Поиск ученика..."
    >

    <button
        class="btn primary"
        id="newStudent"
    >
        + Ученик
    </button>

</div>


<div class="card card-padding">

<div class="table-wrap">

<table>

<thead>

<tr>

<th>
    Ученик
</th>

<th>
    Курс
</th>

<th>
    Цена
</th>

<th>
    Баланс
</th>

<th>
    Занятий
</th>

</tr>

</thead>


<tbody
    id="studentsTable"
></tbody>


</table>

</div>

</div>

</section>


<!-- ========================================================
     SCHEDULE
========================================================= -->

<section
    id="schedule"
    class="view"
>


<div class="toolbar">

    <button
        class="btn primary"
        id="addLesson"
    >
        + Добавить урок
    </button>

    <button
        class="btn"
        id="addEvent"
    >
        + Событие
    </button>

</div>


<div class="card card-padding">


<div class="calendar-toolbar">

<div class="calendar-left">

    <button
        class="icon-btn"
        id="prevPeriod"
        title="Назад"
    >
        ‹
    </button>

    <button
        class="btn"
        id="todayPeriod"
    >
        Сегодня
    </button>

    <button
        class="icon-btn"
        id="nextPeriod"
        title="Вперёд"
    >
        ›
    </button>

    <div
        class="calendar-title"
        id="calendarTitle"
    ></div>

</div>


<div class="view-switcher">

    <button
        data-calendar-view="month"
        class="active"
    >
        Месяц
    </button>

    <button
        data-calendar-view="week"
    >
        Неделя
    </button>

    <button
        data-calendar-view="list"
    >
        Список
    </button>

    <button
        data-calendar-view="day"
    >
        День
    </button>

</div>


</div>


<div
    id="calendar"
></div>


</div>

</section>


<!-- ========================================================
     FINANCE
========================================================= -->

<section
    id="finance"
    class="view"
>


<div
    id="financeStats"
    class="finance-grid"
></div>


<div
    class="toolbar"
    style="margin-top:14px"
>

    <button
        class="btn primary"
        id="addPayment"
    >
        + Оплата
    </button>

    <button
        class="btn"
        id="addExpense"
    >
        + Расход
    </button>

</div>


<div class="dashboard-grid">


<div class="card card-padding">

<div class="section-title">
    Операции
</div>


<div class="table-wrap">

<table>

<thead>

<tr>

<th>
    Тип
</th>

<th>
    Сумма
</th>

<th>
    Дата
</th>

<th>
    Описание
</th>

</tr>

</thead>


<tbody
    id="transactions"
></tbody>

</table>

</div>

</div>


<div class="card card-padding">

<div class="section-title">
    Расходы по категориям
</div>

<div
    id="expenseCategories"
></div>

</div>


</div>

</section>


<!-- ========================================================
     NOTIFICATIONS
========================================================= -->

<section
    id="notifications"
    class="view"
>


<div class="card card-padding">

<div class="table-wrap">

<table>

<thead>

<tr>

<th>
    Источник
</th>

<th>
    Событие
</th>

<th>
    Сводка
</th>

<th>
    Статус
</th>

<th>
    Дата
</th>

</tr>

</thead>


<tbody
    id="notificationTable"
></tbody>

</table>

</div>

</div>

</section>


</main>

</div>


<!-- ========================================================
     MODAL
========================================================= -->

<div
    class="modal"
    id="modal"
>

<div class="modal-box">

<div class="modal-header">

<h2
    id="modalTitle"
>
    Форма
</h2>

<button
    class="close"
    id="modalClose"
>
    ×
</button>

</div>


<div
    class="modal-body"
    id="modalBody"
></div>


</div>

</div>


<script src="app.js?v=2026110702"></script>


<script>/* ITDETI_FRONTEND_FINAL_V1 */</script>

<script src="masterclass.js?v=2026110702"></script>
<script src="schedule-v2.js?v=2026110702"></script>
<script src="finance-v2.js?v=2026110702"></script>
<script src="lms.js?v=2026110702"></script>
<script src="tasks.js?v=2026111101"></script>
</body>
</html>
